<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Complaints — SCMS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1>Manage All Complaints</h1>
            <p style="color:var(--text-muted);font-size:0.9rem;margin-top:4px;">Global registry of citizen complaints. Filter, assign departments, and manage lifecycle status.</p>
          </div>
          <div style="display:flex;gap:10px;">
            <a href="assign-complaints.html" class="btn btn-primary btn-sm">
              <i data-lucide="user-check"></i> Bulk Assign
            </a>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-input">
            <i data-lucide="search"></i>
            <input type="text" id="search" class="form-control" placeholder="Search by ID, title, citizen, location…">
          </div>
          <select id="filter-dept" class="form-control">
            <option value="">All Departments</option>
            <option value="unassigned">Unassigned Only</option>
          </select>
          <select id="filter-status" class="form-control">
            <option value="">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Assigned">Assigned</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
            <option value="Closed">Closed</option>
          </select>
          <select id="filter-category" class="form-control">
            <option value="">All Categories</option>
            <option value="Infrastructure">Infrastructure</option>
            <option value="Water Supply">Water Supply</option>
            <option value="Electricity">Electricity</option>
            <option value="Sanitation">Sanitation</option>
            <option value="Transportation">Transportation</option>
            <option value="Public Safety">Public Safety</option>
            <option value="Other">Other</option>
          </select>
          <select id="filter-priority" class="form-control">
            <option value="">All Priorities</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Urgent">Urgent</option>
          </select>
          <select id="sort-order" class="form-control">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="priority">Highest Priority</option>
          </select>
        </div>

        <div class="table-card">
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title & Citizen</th>
                  <th>Category</th>
                  <th>Department</th>
                  <th>Assigned Staff</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="complaints-table-body"></tbody>
            </table>
          </div>
        </div>

        <div id="pagination-container"></div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let currentPage = 1;
    const PER_PAGE = 10;

    document.addEventListener('DOMContentLoaded', () => {
      const session = requireAuth(['admin']);
      if (!session) return;
      renderDashboardLayout('admin', 'complaints');
      lucide.createIcons();

      // Populate department filter
      const deptFilter = document.getElementById('filter-dept');
      const departments = getDepartments();
      departments.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name;
        deptFilter.appendChild(opt);
      });

      ['search', 'filter-dept', 'filter-status', 'filter-category', 'filter-priority', 'sort-order'].forEach(id => {
        document.getElementById(id).addEventListener(id === 'search' ? 'input' : 'change', () => {
          currentPage = 1;
          renderComplaints();
        });
      });

      renderComplaints();
    });

    function getFilteredComplaints() {
      let complaints = getComplaints();
      const search = document.getElementById('search').value.toLowerCase().trim();
      const dept = document.getElementById('filter-dept').value;
      const status = document.getElementById('filter-status').value;
      const category = document.getElementById('filter-category').value;
      const priority = document.getElementById('filter-priority').value;
      const sort = document.getElementById('sort-order').value;

      if (search) {
        complaints = complaints.filter(c => {
          const citizen = getUserById(c.citizenId);
          const citizenName = citizen ? citizen.name.toLowerCase() : '';
          return c.id.toLowerCase().includes(search) ||
                 c.title.toLowerCase().includes(search) ||
                 (c.location && c.location.toLowerCase().includes(search)) ||
                 citizenName.includes(search);
        });
      }

      if (dept) {
        if (dept === 'unassigned') {
          complaints = complaints.filter(c => !c.departmentId);
        } else {
          complaints = complaints.filter(c => c.departmentId === dept);
        }
      }

      if (status) complaints = complaints.filter(c => c.status === status);
      if (category) complaints = complaints.filter(c => c.category === category);
      if (priority) complaints = complaints.filter(c => c.priority === priority);

      const priorityWeight = { 'Urgent': 4, 'High': 3, 'Medium': 2, 'Low': 1 };
      complaints.sort((a, b) => {
        if (sort === 'priority') {
          return (priorityWeight[b.priority] || 0) - (priorityWeight[a.priority] || 0);
        }
        return sort === 'newest'
          ? new Date(b.createdAt) - new Date(a.createdAt)
          : new Date(a.createdAt) - new Date(b.createdAt);
      });

      return complaints;
    }

    function renderComplaints() {
      const filtered = getFilteredComplaints();
      const tableBody = document.getElementById('complaints-table-body');
      const paginationEl = document.getElementById('pagination-container');
      const { items, totalPages } = paginate(filtered, currentPage, PER_PAGE);

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="9" style="text-align:center;padding:48px 20px;">
              <div style="color:var(--text-muted);font-size:1.1rem;margin-bottom:8px;">No complaints match the criteria.</div>
              <p style="color:var(--text-secondary);font-size:0.875rem;">Try modifying your search query or filters.</p>
            </td>
          </tr>
        `;
        paginationEl.innerHTML = '';
        lucide.createIcons();
        return;
      }

      tableBody.innerHTML = items.map(c => {
        const citizen = getUserById(c.citizenId);
        const dept = c.departmentId ? getDepartmentById(c.departmentId) : null;
        const staff = c.assignedStaffId ? getUserById(c.assignedStaffId) : null;
        return `
          <tr>
            <td><span class="complaint-id-badge">${c.id}</span></td>
            <td>
              <div style="font-weight:600;color:var(--text);">${c.title}</div>
              <div style="font-size:0.75rem;color:var(--text-muted);">By ${citizen ? citizen.name : 'Unknown Citizen'}</div>
            </td>
            <td>
              <i data-lucide="${getCategoryIcon(c.category)}" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i>
              ${c.category}
            </td>
            <td>
              ${dept ? `<span class="dept-pill">${dept.name}</span>` : '<span style="color:var(--amber);font-size:0.8rem;font-weight:600;">Unassigned</span>'}
            </td>
            <td>
              ${staff ? `<div style="font-size:0.85rem;font-weight:500;">${staff.name}</div>` : '<span style="color:var(--text-muted);font-size:0.8rem;">—</span>'}
            </td>
            <td>${priorityBadge(c.priority)}</td>
            <td>${statusBadge(c.status)}</td>
            <td>${timeAgo(c.createdAt)}</td>
            <td>
              <div class="table-actions">
                <a href="complaint-details.html?id=${c.id}" class="btn btn-secondary btn-sm" title="View details & history">
                  <i data-lucide="eye"></i>
                </a>
                <button class="btn btn-primary btn-sm" onclick="openAssignModal('${c.id}')" title="Assign Department/Staff">
                  <i data-lucide="user-check"></i> Assign
                </button>
                <button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="confirmDelete('${c.id}')" title="Delete complaint">
                  <i data-lucide="trash-2"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      renderPagination(paginationEl, currentPage, totalPages, goToPage);
      lucide.createIcons();
    }

    function goToPage(page) {
      currentPage = page;
      renderComplaints();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openAssignModal(complaintId) {
      const complaint = getComplaintById(complaintId);
      if (!complaint) return;

      const departments = getDepartments();
      const allStaff = getUsers().filter(u => u.role === 'staff' && u.active);

      const bodyHTML = `
        <div style="margin-bottom:14px;">
          <strong>Complaint ID:</strong> <span class="complaint-id-badge">${complaint.id}</span>
          <div style="font-weight:600;margin-top:4px;">${complaint.title}</div>
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Assign Department</label>
          <select id="modal-dept-select" class="form-control" onchange="modalUpdateStaff(this.value)">
            <option value="">-- Select Department --</option>
            ${departments.map(d => `<option value="${d.id}" ${complaint.departmentId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Assign Staff Member</label>
          <select id="modal-staff-select" class="form-control">
            <option value="">-- Unassigned --</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Update Status</label>
          <select id="modal-status-select" class="form-control">
            <option value="Pending" ${complaint.status === 'Pending' ? 'selected' : ''}>Pending</option>
            <option value="Assigned" ${complaint.status === 'Assigned' || !complaint.assignedStaffId ? 'selected' : ''}>Assigned</option>
            <option value="In Progress" ${complaint.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
            <option value="Resolved" ${complaint.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
            <option value="Closed" ${complaint.status === 'Closed' ? 'selected' : ''}>Closed</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Assignment Remarks</label>
          <input type="text" id="modal-remarks" class="form-control" placeholder="Remarks or directive for the department..." />
        </div>
      `;

      const footerHTML = `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveAssignment('${complaint.id}')">Save Assignment</button>
      `;

      showModal('Assign / Reassign Complaint', bodyHTML, footerHTML);
      modalUpdateStaff(complaint.departmentId, complaint.assignedStaffId);
    }

    function modalUpdateStaff(deptId, preselectedId = null) {
      const select = document.getElementById('modal-staff-select');
      if (!select) return;
      const allStaff = getUsers().filter(u => u.role === 'staff' && u.active);
      const filtered = deptId ? allStaff.filter(s => s.departmentId === deptId) : allStaff;

      select.innerHTML = '<option value="">-- Unassigned --</option>' +
        filtered.map(s => `<option value="${s.id}" ${s.id === preselectedId ? 'selected' : ''}>${s.name} (${s.email})</option>`).join('');
    }

    function saveAssignment(id) {
      const session = getSession();
      const current = getComplaintById(id);
      if (!current) return;

      const deptId = document.getElementById('modal-dept-select').value || null;
      const staffId = document.getElementById('modal-staff-select').value || null;
      let newStatus = document.getElementById('modal-status-select').value;
      const remarks = document.getElementById('modal-remarks').value.trim() || 'Assigned by Administrator';

      // Auto transition to Assigned if department is chosen and was pending
      if (current.status === 'Pending' && deptId && newStatus === 'Pending') {
        newStatus = 'Assigned';
      }

      updateComplaint(id, {
        departmentId: deptId,
        assignedStaffId: staffId,
        status: newStatus
      });

      addComplaintHistory({
        id: generateId('h_'),
        complaintId: id,
        previousStatus: current.status,
        newStatus,
        remarks: `${remarks}${staffId ? ' (Staff assigned)' : ''}`,
        updatedBy: session.userId,
        updatedAt: now()
      });

      closeModal();
      showToast('Assignment saved successfully!', 'success');
      renderComplaints();
    }

    function confirmDelete(id) {
      showConfirmDialog(
        'Delete Complaint Record',
        `Are you sure you want to permanently delete complaint ${id}? This action cannot be undone.`,
        () => {
          deleteComplaint(id);
          showToast('Complaint record deleted.', 'success');
          renderComplaints();
        },
        'Delete',
        'danger'
      );
    }
  </script>
</body>
</html>
