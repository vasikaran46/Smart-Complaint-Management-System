<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for Smart Complaint Management System">
  <title>Register — SCMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:480px">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i data-lucide="shield-check"></i></div>
        <span>SCMS</span>
      </a>
      <h2>Create Account</h2>
      <p class="auth-subtitle">Register as a citizen to start filing complaints</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name" class="required">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
          <div class="form-error" id="name-error"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="email" class="required">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            <div class="form-error" id="email-error"></div>
          </div>
          <div class="form-group">
            <label for="phone" class="required">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="10-digit number" required>
            <div class="form-error" id="phone-error"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password" class="required">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required>
            <div class="form-error" id="password-error"></div>
          </div>
          <div class="form-group">
            <label for="confirm-password" class="required">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" required>
            <div class="form-error" id="confirm-password-error"></div>
          </div>
        </div>
        <div class="form-error" id="register-error" style="margin-bottom:12px"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i data-lucide="user-plus"></i> Create Account
        </button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
      <p class="auth-footer" style="margin-top:8px;font-size:0.75rem;color:var(--text-muted);">
        Registration creates a Citizen account. Staff and Admin accounts are managed by administrators.
      </p>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      redirectIfLoggedIn();

      document.getElementById('register-form').addEventListener('submit', (e) => {
        e.preventDefault();
        clearErrors();

        const data = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password: document.getElementById('password').value,
          confirmPassword: document.getElementById('confirm-password').value
        };

        let valid = true;
        if (!data.name.trim()) { showFieldError('name', 'Name is required'); valid = false; }
        if (!data.email.trim()) { showFieldError('email', 'Email is required'); valid = false; }
        else if (!isValidEmail(data.email)) { showFieldError('email', 'Enter a valid email'); valid = false; }
        if (!data.phone.trim()) { showFieldError('phone', 'Phone is required'); valid = false; }
        else if (!isValidPhone(data.phone)) { showFieldError('phone', 'Enter a valid phone number'); valid = false; }
        if (!data.password) { showFieldError('password', 'Password is required'); valid = false; }
        else if (data.password.length < 6) { showFieldError('password', 'Min 6 characters'); valid = false; }
        if (data.password !== data.confirmPassword) { showFieldError('confirm-password', 'Passwords do not match'); valid = false; }
        if (!valid) return;

        const result = registerUser(data);
        if (result.success) {
          showToast('Account created successfully! Redirecting…', 'success');
          setTimeout(() => redirectToDashboard(result.user.role), 800);
        } else {
          document.getElementById('register-error').textContent = result.message;
        }
      });
    });

    function showFieldError(field, msg) {
      document.getElementById(field).classList.add('error');
      document.getElementById(field + '-error').textContent = msg;
    }
    function clearErrors() {
      document.querySelectorAll('.form-control.error').forEach(el => el.classList.remove('error'));
      document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
    }
  </script>
</body>
</html>
